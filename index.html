            max-width: 600px;
            margin: auto;
            padding: 40px;

        }

        }

        }

            padding: 0;
        }

        li {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            margin: 5px;
            border-radius: 10px;

        button {

            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }
